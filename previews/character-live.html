<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>キャラクター（動く版）</title>
    <link rel="stylesheet" href="./character-live.css" />
    <style>
      body { margin: 0; background: #fff; font-family: sans-serif; color: #5d6a82; }
      .row { display: flex; align-items: flex-end; gap: 28px; padding: 24px; flex-wrap: wrap; }
      .cell p { margin: 6px 0 0; text-align: center; font-size: 14px; }
      .big { width: 300px; height: 360px; }
      .small { width: 90px; height: 110px; }
      .head { width: 56px; height: 56px; }
      h2 { margin: 16px 24px 0; font-size: 16px; color: #1c2536; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h } from 'react';
      import { createRoot } from 'react-dom/client';
      import Character from './CharacterLive2.jsx';
      const params = new URLSearchParams(location.search);
      const still = params.has('still');
      const cell = (label, size, props, extra = '') =>
        h('div', { className: 'cell' }, h('div', { className: `${size} ${extra}` }, h(Character, { skipBirth: true, ...props })), h('p', null, label));
      createRoot(document.getElementById('root')).render(
        still
          ? h('div', null,
              h('h2', null, '口とまばたきの絵（止めて並べたもの）'),
              h('div', { className: 'row force-still' },
                cell('ふだん（写真の口）', 'big', {}),
                cell('しゃべる：半開き', 'big', {}, 'force-half'),
                cell('しゃべる：閉じる', 'big', {}, 'force-closed'),
                cell('まばたき', 'big', {}, 'force-blink'),
              ),
              h('div', { className: 'row force-still' },
                cell('画面の右下（小）', 'small', {}),
                cell('隠したとき', 'head', { pose: 'head' }),
              ))
          : h('div', null,
              h('h2', null, '動いている様子'),
              h('div', { className: 'row' },
                cell('ふだん（ゆれる・まばたき）', 'big', {}),
                cell('しゃべっているとき', 'big', { talking: true }),
                cell('画面の右下（小）', 'small', { talking: true }),
                cell('隠したとき', 'head', { pose: 'head' }),
              )),
      );
    </script>
  </body>
</html>
