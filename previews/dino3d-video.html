<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ドキちゃん 3D 動画</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
      body { background: linear-gradient(180deg, #eaf4ff 0%, #fff8d9 100%); font-family: 'Kosugi Maru', sans-serif; }
      .cell { position: absolute; left: 340px; top: 10px; width: 600px; height: 640px; }
      .cell > .dino3d { width: 100%; height: 100%; }
      .caption { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-size: 32px; font-weight: 700; color: #2c4d7a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h, useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import Dino3D from './Dino3D_v9.jsx';
      function App() {
        const [talking, setTalking] = useState(false);
        const [cheer, setCheer] = useState(0);
        const [caption, setCaption] = useState('');
        Object.assign(window, { setTalking, setCheer, setCaption });
        return h('div', null, h('div', { className: 'cell' }, h(Dino3D, { skipBirth: false, talking, cheer })), h('div', { className: 'caption' }, caption));
      }
      createRoot(document.getElementById('root')).render(h(App));
      window.ready = true;
    </script>
  </body>
</html>
