<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ドキちゃん 3D</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
      body { background: linear-gradient(180deg, #eaf4ff 0%, #fff8d9 100%); font-family: sans-serif; }
      .row { display: flex; justify-content: space-around; align-items: flex-end; padding: 30px 20px 0; }
      .cell { width: 380px; height: 560px; }
      .cell > .dino3d { width: 100%; height: 100%; }
      .labels { display: flex; justify-content: space-around; padding: 0 20px; }
      .labels span { width: 380px; text-align: center; font-size: 24px; color: #2c4d7a; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h, useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import Dino3D from './DinoReal_r3.jsx';
      function App() {
        const [cheer, setCheer] = useState(0);
        window.setCheer = setCheer;
        return h('div', null,
          h('div', { className: 'row' },
            h('div', { className: 'cell' }, h(Dino3D, { skipBirth: true })),
            h('div', { className: 'cell' }, h(Dino3D, { skipBirth: true, talking: true })),
            h('div', { className: 'cell' }, h(Dino3D, { skipBirth: true, cheer })),
          ),
          h('div', { className: 'labels' }, h('span', null, 'ふだん'), h('span', null, 'しゃべっているとき'), h('span', null, 'グッド（アカウント完成など）')),
        );
      }
      createRoot(document.getElementById('root')).render(h(App));
      window.ready = true;
    </script>
  </body>
</html>
