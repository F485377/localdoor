<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: linear-gradient(180deg, #eaf4ff 0%, #fff8d9 100%); }
      .a { position: absolute; left: 0; top: 0; width: 640px; height: 720px; }
      .b { position: absolute; left: 640px; top: 0; width: 640px; height: 720px; }
      .a > div, .b > div { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h } from 'react';
      import { createRoot } from 'react-dom/client';
      import Dino from './DinoReal_r3.jsx';
      createRoot(document.getElementById('root')).render(h('div', null,
        h('div', { className: 'a' }, h(Dino, { skipBirth: true, pose: 'head' })),
        h('div', { className: 'b' }, h(Dino, { skipBirth: true })),
      ));
      window.ready = true;
    </script>
  </body>
</html>
